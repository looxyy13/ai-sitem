workflows:
  loxy-ai-ios:
    name: Loxy AI iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      - name: Add iOS platform
        script: |
          npx cap add ios || true
          npx cap copy ios
      - name: Install Pods
        script: |
          cd ios/App
          pod install
      - name: Build iOS without signing
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath build
    artifacts:
      - ios/App/build/Build/Products/Release-iphoneos/*.app